spring:
  application:
    name: fraudshield-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraudshield}
    username: ${DB_USERNAME:fraudshield}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

fraudshield:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:fraudshield-backend}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    gateway:
      api-key: ${GATEWAY_API_KEY:}
  dev-users:
    enabled: false
  ai:
    prediction-url: ${AI_SERVICE_URL:http://localhost:8000/internal/v1/predictions}
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    timeout-ms: ${AI_TIMEOUT_MS:150}
